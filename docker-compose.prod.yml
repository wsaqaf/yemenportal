services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  db:
    restart: always

  redis:
    restart: always

  celery_worker:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: always

  celery_beat:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: always
