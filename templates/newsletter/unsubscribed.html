<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلغاء الاشتراك - بوابة اليمن الإخبارية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 text-gray-800">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 max-w-md w-full text-center">
        {% if error %}
        <div class="w-14 h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900 mb-2">رابط غير صالح أو منتهي الصلاحية</h1>
        <p class="text-gray-600 text-sm mb-6">تعذر التحقق من الرابط. قد يكون تم استخدامه مسبقاً أو انتهت صلاحيته.</p>
        {% else %}
        <div class="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900 mb-2">تم إلغاء الاشتراك بنجاح</h1>
        <p class="text-gray-600 text-sm mb-6">تمت إزالة بريدك الإلكتروني ({{ email }}) من قائمة إرسال النشرة الإخبارية الدورية.</p>
        {% endif %}
        <a href="/" class="inline-block px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition">العودة للرئيسية</a>
    </div>
</body>
</html>
