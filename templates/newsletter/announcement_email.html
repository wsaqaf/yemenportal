<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, Tahoma, sans-serif; background-color: #f3f4f6; margin: 0; padding: 25px 15px; direction: rtl; text-align: right;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 620px; background-color: #ffffff; border-radius: 14px; overflow: hidden; border: 1px solid #e5e7eb; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
        <tr>
            <td style="background-color: #1e3a8a; padding: 22px 28px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 20px; font-weight: bold;">بوابة اليمن الإخبارية</h1>
                <p style="color: #93c5fd; margin: 4px 0 0; font-size: 13px;">رسالة وإشعار خاص بالأعضاء</p>
            </td>
        </tr>
        <tr>
            <td style="padding: 30px 28px; color: #1f2937; line-height: 1.8; font-size: 15px;">
                <h2 style="font-size: 18px; color: #111827; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #3b82f6; padding-bottom: 10px;">
                    {{ subject }}
                </h2>
                
                <div style="font-size: 15px; color: #374151; white-space: pre-line;">
                    {% if is_html %}{{ body|safe }}{% else %}{{ body }}{% endif %}
                </div>
            </td>
        </tr>
        <tr>
            <td style="background-color: #f9fafb; padding: 18px 24px; text-align: center; font-size: 12px; color: #6b7280; border-top: 1px solid #e5e7eb;">
                أنت تتلقى هذه الرسالة بصفتك عضواً في <a href="{{ site_url }}" style="color: #2563eb; text-decoration: none;">بوابة اليمن الإخبارية</a>.<br>
                <a href="{{ unsub_url }}" style="color: #4b5563; text-decoration: underline; margin-top: 8px; display: inline-block;">إلغاء الاشتراك من الرسائل البريدية بنقرة واحدة</a>
            </td>
        </tr>
    </table>
</body>
</html>
