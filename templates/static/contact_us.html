{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}اتصل بنا - يمن بورتال{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-10 bg-white rounded-[2.5rem] shadow-2xl border border-gray-100 mb-12">
    <div class="text-center mb-10">
        <h1 class="text-3xl font-black text-gray-900 mb-4">اتصل بنا</h1>
        <p class="text-gray-500">يسعدنا دائماً سماع ملاحظاتكم واستفساراتكم</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">الاسم</label>
                <input type="text" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني</label>
                <input type="email" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">الموضوع</label>
                <select class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none">
                    <option>استفسار عام</option>
                    <option>اقتراح مصدر جديد</option>
                    <option>ملاحظة حول خبر أو مصدر</option>
                    <option>طلب انضمام لفريق التقييم</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">الرسالة</label>
                <textarea rows="5" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"></textarea>
            </div>
        </div>

        <button type="submit" class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-xl hover:bg-blue-700 transition-all transform hover:-translate-y-1">
            إرسال الرسالة
        </button>
    </form>
</div>
{% endblock %}
