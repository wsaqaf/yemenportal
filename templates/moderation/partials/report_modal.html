<!-- Report Modal -->
<div id="report-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-4" dir="rtl">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-gray-100 transform transition-all text-right">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-4">
            <div class="flex items-center gap-2">
                <span class="p-2 bg-red-50 text-red-600 rounded-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </span>
                <h3 class="text-lg font-bold text-gray-900">إبلاغ عن محتوى مخالف</h3>
            </div>
            <button type="button" onclick="closeReportModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Post Title Preview -->
        <p id="report-post-title" class="text-xs text-gray-500 bg-gray-50 p-2.5 rounded-xl mb-4 line-clamp-2"></p>

        <!-- Form -->
        <form id="report-form" onsubmit="submitReportForm(event)">
            <input type="hidden" id="report-post-id" name="post_id" value="">

            <label class="block text-sm font-semibold text-gray-700 mb-2">ما هو سبب البلاغ؟</label>
            
            <div class="space-y-2 mb-4">
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="flag_id" value="1" class="text-primary focus:ring-primary" checked onchange="toggleCustomReason(false)">
                    <span class="text-sm text-gray-800 font-medium">خطاب كراهية أو تحريض على العنف</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="flag_id" value="2" class="text-primary focus:ring-primary" onchange="toggleCustomReason(false)">
                    <span class="text-sm text-gray-800 font-medium">تضليل أو فبركة وأخبار كاذبة</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="flag_id" value="3" class="text-primary focus:ring-primary" onchange="toggleCustomReason(false)">
                    <span class="text-sm text-gray-800 font-medium">انتهاك حقوق الملكية الفكرية</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="flag_id" value="4" class="text-primary focus:ring-primary" onchange="toggleCustomReason(false)">
                    <span class="text-sm text-gray-800 font-medium">محتوى مسيء أو غير لائق</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="flag_id" value="5" class="text-primary focus:ring-primary" onchange="toggleCustomReason(false)">
                    <span class="text-sm text-gray-800 font-medium">خبر قديم أو مكرر</span>
                </label>
                <label class="flex items-center gap-2.5 p-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
                    <input type="radio" name="flag_id" value="6" id="radio-other" class="text-primary focus:ring-primary" onchange="toggleCustomReason(true)">
                    <span class="text-sm text-gray-800 font-medium">غير ذلك (يرجى التوضيح)</span>
                </label>
            </div>

            <!-- Custom Explanation Textarea -->
            <div id="custom-reason-container" class="mb-4 hidden">
                <label class="block text-xs font-semibold text-gray-700 mb-1">تفاصيل الشكوى <span class="text-red-500">*</span></label>
                <textarea id="custom-reason-text" name="custom_reason" rows="3" 
                          placeholder="اكتب هنا توضيحاً موجزاً للمخالفة..." 
                          class="w-full text-sm p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-hidden resize-none"></textarea>
            </div>

            <!-- Response message container -->
            <div id="report-feedback" class="text-sm font-medium p-3 rounded-xl mb-4 hidden"></div>

            <!-- Submit Buttons -->
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100">
                <button type="button" onclick="closeReportModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-xl">إلغاء</button>
                <button type="submit" id="report-submit-btn" class="px-5 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-xs transition">إرسال البلاغ</button>
            </div>
        </form>
    </div>
</div>

<script>
function triggerReportModal(postId, postTitle) {
    document.getElementById('report-post-id').value = postId;
    document.getElementById('report-post-title').innerText = postTitle;
    document.getElementById('report-modal').classList.remove('hidden');
    document.getElementById('report-feedback').classList.add('hidden');
    document.getElementById('report-submit-btn').disabled = false;
    document.getElementById('report-submit-btn').innerText = 'إرسال البلاغ';
}

function closeReportModal() {
    document.getElementById('report-modal').classList.add('hidden');
    document.getElementById('custom-reason-text').value = '';
    toggleCustomReason(false);
}

function toggleCustomReason(show) {
    const container = document.getElementById('custom-reason-container');
    const textarea = document.getElementById('custom-reason-text');
    if (show) {
        container.classList.remove('hidden');
        textarea.focus();
    } else {
        container.classList.add('hidden');
    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function submitReportForm(event) {
    event.preventDefault();
    const postId = document.getElementById('report-post-id').value;
    const btn = document.getElementById('report-submit-btn');
    const feedback = document.getElementById('report-feedback');
    const isOther = document.getElementById('radio-other').checked;
    const customReason = document.getElementById('custom-reason-text').value.trim();

    if (isOther && customReason.length === 0) {
        feedback.className = 'text-sm font-medium p-3 rounded-xl mb-4 bg-red-50 text-red-600 border border-red-200 block';
        feedback.innerText = 'يرجى كتابة توضيح لسبب الشكوى.';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'جارٍ الإرسال...';

    const formData = new FormData(document.getElementById('report-form'));
    const csrfToken = getCookie('csrftoken') || document.querySelector('[name=csrfmiddlewaretoken]')?.value;

    try {
        const response = await fetch('/moderation/report/' + postId + '/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': csrfToken,
            }
        });
        const data = await response.json();

        if (data.status === 'success') {
            feedback.className = 'text-sm font-medium p-3 rounded-xl mb-4 bg-green-50 text-green-700 border border-green-200 block';
            feedback.innerText = data.message;
            setTimeout(() => {
                closeReportModal();
            }, 2000);
        } else {
            feedback.className = 'text-sm font-medium p-3 rounded-xl mb-4 bg-red-50 text-red-600 border border-red-200 block';
            feedback.innerText = 'حدث خطأ أثناء إرسال البلاغ. يرجى المحاولة لاحقاً.';
            btn.disabled = false;
            btn.innerText = 'إرسال البلاغ';
        }
    } catch (err) {
        feedback.className = 'text-sm font-medium p-3 rounded-xl mb-4 bg-red-50 text-red-600 border border-red-200 block';
        feedback.innerText = 'تعذر الاتصال بالخادم. يرجى التحقق من اتصالك.';
        btn.disabled = false;
        btn.innerText = 'إرسال البلاغ';
    }
}
</script>
