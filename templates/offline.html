<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنت غير متصل بالإنترنت - يمن بورتال</title>
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/static/images/pwa/apple-touch-icon.png">
    <meta name="theme-color" content="#1779ba">
    <script>
        (function() {
            try {
                if (localStorage.getItem('yp_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1779ba',
                        brandPurple: '#663399',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-gray-200 dark:border-slate-700 p-8 text-center space-y-6">
        <!-- Brand Logo / Emblem -->
        <div class="flex justify-center">
            <div class="w-20 h-20 rounded-2xl bg-blue-50 dark:bg-slate-700/60 p-3 shadow-inner flex items-center justify-center">
                <img src="/static/images/pwa/icon-192x192.png" alt="يمن بورتال" class="w-14 h-14 object-contain">
            </div>
        </div>

        <!-- Disconnected Wifi Icon & Status -->
        <div class="space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-900/50">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                <span>لا يوجد اتصال بالإنترنت</span>
            </div>
            <h1 class="text-2xl font-black text-gray-900 dark:text-white pt-2">أنت تتصفح دون اتصال</h1>
            <p class="text-sm text-gray-500 dark:text-slate-400 leading-relaxed">
                يبدو أن جهازك غير متصل بالشبكة حالياً. لا تقلق، يمكنك الاستمرار في قراءة المقالات والصفحات التي قمت بزيارتها مسبقاً والمحفوظة على جهازك.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3 pt-2">
            <button onclick="window.location.reload()" class="w-full py-3.5 px-6 rounded-2xl bg-primary hover:bg-blue-700 text-white font-bold text-sm shadow-lg shadow-blue-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>إعادة المحاولة والاتصال</span>
            </button>

            <a href="/" class="block w-full py-3 px-6 rounded-2xl bg-gray-100 hover:bg-gray-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-gray-700 dark:text-slate-200 font-bold text-sm transition-all">
                العودة للصفحة الرئيسية
            </a>
        </div>

        <!-- Auto-reconnect notification -->
        <div id="reconnect-banner" class="hidden p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs font-bold">
            🎉 تمت استعادة الاتصال بالإنترنت! جارٍ تحديث الصفحة...
        </div>
    </div>

    <script>
        // Auto reload when internet returns
        window.addEventListener('online', function() {
            var banner = document.getElementById('reconnect-banner');
            if (banner) banner.classList.remove('hidden');
            setTimeout(function() {
                window.location.reload();
            }, 1200);
        });
    </script>
</body>
</html>
