<div class="flex items-center gap-1.5" id="vote-controls-{{ post.id }}">
    <!-- Upvote -->
    <button class="p-1.5 rounded-lg border transition-colors flex items-center justify-center {% if post.is_upvoted or user_voted == 1 %}bg-green-50 text-green-600 border-green-200{% else %}bg-gray-50 text-gray-500 border-gray-200 hover:text-green-600 hover:bg-green-50{% endif %}"
            hx-post="{% url 'posts:vote' post.id %}" 
            hx-vals='{"value": 1}' 
            hx-target="#vote-controls-{{ post.id }}" 
            hx-swap="outerHTML"
            title="أؤيد الخبر">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
    </button>

    <!-- Score -->
    <span class="px-2 text-xs font-bold {% if post.voting_result > 0 %}text-green-600{% elif post.voting_result < 0 %}text-red-600{% else %}text-gray-600{% endif %}" dir="ltr">
        {{ post.voting_result }}
    </span>

    <!-- Downvote -->
    <button class="p-1.5 rounded-lg border transition-colors flex items-center justify-center {% if post.is_downvoted or user_voted == -1 %}bg-red-50 text-red-600 border-red-200{% else %}bg-gray-50 text-gray-500 border-gray-200 hover:text-red-600 hover:bg-red-50{% endif %}"
            hx-post="{% url 'posts:vote' post.id %}" 
            hx-vals='{"value": -1}' 
            hx-target="#vote-controls-{{ post.id }}" 
            hx-swap="outerHTML"
            title="أعارض الخبر">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
</div>
