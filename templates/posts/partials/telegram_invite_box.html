<!-- Telegram Channel Quick Invite Box -->
<div class="yp-telegram-invite-card relative group">
    <a href="https://t.me/yemen_portal" target="_blank" rel="noopener noreferrer" 
       class="flex items-center justify-between gap-3 px-3.5 py-2.5 rounded-2xl bg-gradient-to-r from-sky-500/10 via-sky-50/80 to-blue-50/50 dark:from-sky-950/40 dark:via-slate-800 dark:to-slate-800/90 border border-sky-200/80 dark:border-sky-900/60 hover:border-sky-400 dark:hover:border-sky-700 shadow-2xs hover:shadow-xs transition-all duration-200">
        <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-sky-500 text-white flex items-center justify-center flex-shrink-0 shadow-xs group-hover:scale-105 transition-transform">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.942z"/>
                </svg>
            </div>
            <span class="text-xs sm:text-sm font-black text-sky-900 dark:text-sky-200 group-hover:text-sky-600 dark:group-hover:text-sky-300 transition-colors truncate">
                إنضم لقناة يمن بورتال على تيليجرام
            </span>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-sky-500 group-hover:-translate-x-0.5 transition-transform">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </span>
            <button type="button" 
                    onclick="event.preventDefault(); event.stopPropagation(); dismissTelegramInviteCards()" 
                    class="text-gray-400 hover:text-gray-600 dark:hover:text-slate-300 p-1 rounded-lg text-xs hover:bg-black/5 dark:hover:bg-white/5 transition" 
                    title="إخفاء الإشعار">
                ✕
            </button>
        </div>
    </a>
</div>

<script>
    if (typeof window.dismissTelegramInviteCards === 'undefined') {
        window.dismissTelegramInviteCards = function() {
            document.querySelectorAll('.yp-telegram-invite-card').forEach(function(el) {
                el.style.display = 'none';
            });
            try { localStorage.setItem('yp_dismiss_tg_invite', Date.now()); } catch(e) {}
        };
        (function() {
            try {
                const ts = localStorage.getItem('yp_dismiss_tg_invite');
                if (ts && (Date.now() - parseInt(ts, 10) < 7 * 86400 * 1000)) {
                    document.querySelectorAll('.yp-telegram-invite-card').forEach(function(el) {
                        el.style.display = 'none';
                    });
                }
            } catch(e) {}
        })();
    }
</script>
