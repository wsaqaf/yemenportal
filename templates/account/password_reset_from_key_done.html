{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password" %} - يمن بورتال{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md p-8 bg-white rounded-3xl shadow-xl border border-gray-100 text-center">
        
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-extrabold text-gray-900 mb-4">تم تغيير كلمة المرور بنجاح!</h1>
        <p class="text-gray-600 leading-relaxed mb-8">
            يمكنك الآن استخدام كلمة المرور الجديدة لتسجيل الدخول إلى حسابك.
        </p>

        <a href="{% url 'account_login' %}" class="inline-block w-full py-3 px-4 bg-primary hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all duration-300">
            تسجيل الدخول الآن
        </a>
    </div>
</div>
{% endblock %}
