{% extends "base.html" %}

{% block title %}التحقق من البريد الإلكتروني - يمن بورتال{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-12 px-4">
    <div class="bg-white border border-gray-100 rounded-3xl shadow-sm p-8 text-center space-y-5">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-primary rounded-full mb-2">
            <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-black text-gray-900">التحقق من البريد الإلكتروني</h1>
        <p class="text-gray-600 leading-relaxed text-sm">
            تم إرسال رابط التفعيل إلى عنوان بريدك الإلكتروني. يرجى فتح الرابط لتأكيد حسابك والبدء في استخدام الموقع.
        </p>
        <div class="pt-6 border-t border-gray-100 flex justify-center gap-4">
            <a href="/" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold rounded-xl transition-colors">
                العودة للرئيسية
            </a>
            <a href="{% url 'account_login' %}" class="px-5 py-2.5 bg-primary hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition-colors">
                تسجيل الدخول
            </a>
        </div>
    </div>
</div>
{% endblock %}
