{% if not user.is_authenticated and google_client_id %}
<!-- 1. Google One Tap (Google Identity Services) Prompt -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<div id="g_id_onload"
     data-client_id="{{ google_client_id }}"
     data-login_uri="{% url 'google_login_by_token' %}"
     data-auto_prompt="true"
     data-cancel_on_tap_outside="false"
     data-prompt_parent_id="g_id_onload"
     style="position: fixed; top: 75px; left: 24px; z-index: 9999;">
</div>

<!-- 2. Tiny Non-Obstructive Google Login Pop-up (Interactive Fallback / Voting Trigger) -->
<div id="yp-google-login-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs transition-opacity" onclick="if(event.target===this) this.classList.add('hidden')">
    <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-3xl p-6 sm:p-7 shadow-2xl max-w-sm w-full text-center relative transform transition-all scale-100">
        <!-- Close Button -->
        <button type="button" onclick="document.getElementById('yp-google-login-modal').classList.add('hidden')" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 dark:hover:bg-slate-700 transition" title="إغلاق">
            ✕
        </button>

        <!-- Google Icon Badge -->
        <div class="w-14 h-14 mx-auto mb-4 bg-gray-50 dark:bg-slate-700/80 rounded-2xl flex items-center justify-center shadow-inner border border-gray-100 dark:border-slate-600">
            <svg class="w-7 h-7" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
        </div>

        <h3 class="text-base font-extrabold text-gray-900 dark:text-slate-100 mb-1.5">
            تسجيل الدخول للتصويت والتفاعل
        </h3>
        <p class="text-xs text-gray-500 dark:text-slate-400 mb-5 leading-relaxed">
            لتسجيل تقييمك ودعم الأخبار الموثوقة، تابع بنقرة واحدة عبر حسابك في Google دون الحاجة لكلمة مرور.
        </p>

        <!-- Google One-Click Button -->
        <a href="{% url 'google_login' %}?next={{ request.get_full_path|default:'/' }}"
           class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-700 hover:bg-gray-50 dark:hover:bg-slate-600 text-gray-700 dark:text-slate-100 font-bold py-3 px-4 rounded-2xl border border-gray-300 dark:border-slate-600 shadow-sm transition-all text-xs sm:text-sm">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>المتابعة عبر حساب Google</span>
        </a>

        <div class="mt-4 text-[11px] text-gray-400">
            تظل مسجلاً تلقائياً للتصويت في كل زيارة
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.body.addEventListener('yp-prompt-google-login', function(e) {
            try {
                if (window.google && google.accounts && google.accounts.id) {
                    google.accounts.id.prompt();
                }
            } catch (err) {}
            const modal = document.getElementById('yp-google-login-modal');
            if (modal) {
                modal.classList.remove('hidden');
            }
        });
    });
</script>
{% endif %}
