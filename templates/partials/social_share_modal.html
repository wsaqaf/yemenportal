<!-- Desktop Social Share Modal -->
<div id="yp-social-share-modal" 
     class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-4" 
     dir="rtl" 
     role="dialog" 
     aria-modal="true" 
     aria-labelledby="yp-share-modal-title-heading">
    
    <!-- Modal Backdrop Click Dismiss -->
    <div class="fixed inset-0 -z-10" onclick="closeSocialShareModal()"></div>

    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-gray-100 dark:border-slate-700 transform transition-all text-right relative">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-3.5 border-b border-gray-100 dark:border-slate-700/80 mb-4">
            <div class="flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                    </svg>
                </span>
                <div>
                    <h3 id="yp-share-modal-title-heading" class="text-base font-black text-gray-900 dark:text-white">مشاركة الخبر</h3>
                    <p class="text-[11px] text-gray-400 dark:text-slate-400">اختر المنصة التي تود مشاركة الخبر عبرها</p>
                </div>
            </div>
            <button type="button" 
                    onclick="closeSocialShareModal()" 
                    class="text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 p-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-700 transition"
                    aria-label="إغلاق النافذة">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Post Title Preview -->
        <div class="mb-4 p-3 rounded-2xl bg-gray-50 dark:bg-slate-900/60 border border-gray-100 dark:border-slate-700/60">
            <span class="text-[10px] font-bold text-gray-400 dark:text-slate-400 block mb-1">عنوان الخبر:</span>
            <p id="yp-share-modal-title" class="text-xs sm:text-sm text-gray-800 dark:text-slate-200 font-bold leading-relaxed line-clamp-2"></p>
        </div>

        <!-- Social Networks Grid (Desktop Quick Share) -->
        <div class="grid grid-cols-2 gap-2.5 mb-4">
            <!-- WhatsApp Web -->
            <a id="yp-share-whatsapp" href="#" target="_blank" rel="noopener noreferrer" 
               onclick="handleSocialShareClick('whatsapp')"
               class="flex items-center gap-2.5 p-3 rounded-2xl border border-emerald-200 dark:border-emerald-800/80 bg-emerald-50/80 dark:bg-emerald-950/30 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 transition-all text-emerald-800 dark:text-emerald-200 font-bold text-xs sm:text-sm group shadow-xs">
                <span class="w-8 h-8 rounded-xl bg-emerald-500 text-white flex items-center justify-center flex-shrink-0 shadow-xs group-hover:scale-105 transition-transform">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.557 4.125 1.532 5.857L.073 23.927l6.275-1.435A11.95 11.95 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.011-1.377l-.36-.214-3.727.853.884-3.631-.235-.373A9.818 9.818 0 1 1 12 21.818z"/></svg>
                </span>
                <span>واتساب</span>
            </a>

            <!-- X / Twitter -->
            <a id="yp-share-twitter" href="#" target="_blank" rel="noopener noreferrer" 
               onclick="handleSocialShareClick('twitter')"
               class="flex items-center gap-2.5 p-3 rounded-2xl border border-gray-300 dark:border-slate-600 bg-gray-100/70 dark:bg-slate-700/60 hover:bg-gray-200/80 dark:hover:bg-slate-600 transition-all text-gray-900 dark:text-white font-bold text-xs sm:text-sm group shadow-xs">
                <span class="w-8 h-8 rounded-xl bg-gray-900 dark:bg-black text-white flex items-center justify-center flex-shrink-0 shadow-xs group-hover:scale-105 transition-transform">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </span>
                <span>منصة X</span>
            </a>

            <!-- Facebook -->
            <a id="yp-share-facebook" href="#" target="_blank" rel="noopener noreferrer" 
               onclick="handleSocialShareClick('facebook')"
               class="flex items-center gap-2.5 p-3 rounded-2xl border border-blue-200 dark:border-blue-800/80 bg-blue-50/80 dark:bg-blue-950/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-all text-blue-800 dark:text-blue-200 font-bold text-xs sm:text-sm group shadow-xs">
                <span class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center flex-shrink-0 shadow-xs group-hover:scale-105 transition-transform">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                </span>
                <span>فيسبوك</span>
            </a>

            <!-- Telegram -->
            <a id="yp-share-telegram" href="#" target="_blank" rel="noopener noreferrer" 
               onclick="handleSocialShareClick('telegram')"
               class="flex items-center gap-2.5 p-3 rounded-2xl border border-sky-200 dark:border-sky-800/80 bg-sky-50/80 dark:bg-sky-950/30 hover:bg-sky-100 dark:hover:bg-sky-900/50 transition-all text-sky-800 dark:text-sky-200 font-bold text-xs sm:text-sm group shadow-xs">
                <span class="w-8 h-8 rounded-xl bg-sky-500 text-white flex items-center justify-center flex-shrink-0 shadow-xs group-hover:scale-105 transition-transform">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.942z"/></svg>
                </span>
                <span>تيليجرام</span>
            </a>
        </div>

        <!-- Copy Link Section -->
        <div class="mb-3">
            <label for="yp-share-modal-url-input" class="block text-[11px] font-bold text-gray-500 dark:text-slate-400 mb-1">رابط الخبر المباشر:</label>
            <div class="flex items-center gap-1.5 p-1.5 bg-gray-50 dark:bg-slate-900/70 border border-gray-200 dark:border-slate-700 rounded-2xl">
                <input id="yp-share-modal-url-input" 
                       type="text" 
                       readonly 
                       onclick="this.select()" 
                       class="flex-1 bg-transparent border-none text-xs text-gray-700 dark:text-slate-200 px-2 py-1 outline-none font-mono truncate" 
                       dir="ltr">
                <button type="button" 
                        id="yp-share-copy-btn" 
                        onclick="copyShareModalUrl()" 
                        class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition shadow-xs flex items-center gap-1 flex-shrink-0">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span id="yp-share-copy-btn-text">نسخ الرابط</span>
                </button>
            </div>
        </div>

        <!-- Optional Desktop System Share (AirDrop / macOS / Windows native) -->
        <div id="yp-share-desktop-native" class="hidden pt-3 border-t border-gray-100 dark:border-slate-700/80 text-center">
            <button type="button" 
                    onclick="triggerDesktopNativeShare()" 
                    class="w-full py-2 px-3 text-xs font-bold text-gray-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-50 dark:hover:bg-slate-700/50 rounded-xl transition inline-flex items-center justify-center gap-1.5 border border-dashed border-gray-200 dark:border-slate-700">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                <span>خيارات أخرى عبر نظام التشغيل (AirDrop، البريد، الملاحظات...)</span>
            </button>
        </div>

    </div>
</div>
