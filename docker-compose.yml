
services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2

  db:
    image: postgres:15-alpine
    shm_size: 1gb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=yemenportal
      - POSTGRES_USER=yemenportal
      - POSTGRES_PASSWORD=yemenportal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yemenportal -d yemenportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
